<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani IT LMS Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #060b19;
            color: #f1f5f9;
            min-height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        /* Auth Screen */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top right, #0f172a, #030712);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .brand-logo span {
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .auth-box p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .role-cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .role-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 18px;
            border-radius: 12px;
            color: #fff;
            text-align: left;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .role-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            transform: translateY(-2px);
        }

        .role-btn.admin:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.12);
        }

        .role-btn strong {
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .role-btn.admin strong {
            color: #c084fc;
        }

        .role-btn span {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Main LMS Layout */
        .lms-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-header h2 span {
            color: #38bdf8;
        }

        .badge {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            font-weight: bold;
        }

        .badge.admin-badge {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border-color: rgba(168, 85, 247, 0.4);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 24px;
            flex: 1;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 12px 16px;
            text-align: left;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }

        .nav-item.active {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border-left: 3px solid #38bdf8;
            font-weight: 600;
        }

        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .u-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .user-profile small {
            color: #64748b;
            font-size: 0.75rem;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .topbar {
            padding: 20px 32px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            font-size: 1.4rem;
        }

        #currentDate {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .content-area {
            padding: 32px;
        }

        /* Cards & Grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-card h4 {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
        }

        /* Tables */
        .panel-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.9rem;
        }

        th {
            color: #94a3b8;
            font-weight: 600;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-pending { background: rgba(234, 179, 8, 0.15); color: #facc15; }
        .status-submitted { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .status-approved { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .status-rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        /* Buttons & Inputs */
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary { background: #0284c7; color: #fff; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 14px;
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 6px;
            color: #fff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background: #1e293b;
            border: 1px solid #38bdf8;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Role Login / Switcher Screen -->
    <div id="authScreen" class="auth-overlay">
        <div class="auth-box">
            <div class="brand-logo">SMIT <span>LMS</span></div>
            <p>Select your portal access role to continue</p>
            <div class="role-cards">
                <button class="role-btn" onclick="loginAs('student')">
                    <strong>Student Portal</strong>
                    <span>View courses, submit tasks & check attendance</span>
                </button>
                <button class="role-btn admin" onclick="loginAs('admin')">
                    <strong>Admin Panel</strong>
                    <span>Manage courses, create tasks & grade submissions</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main LMS Layout -->
    <div id="lmsContainer" class="lms-wrapper hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SMIT <span>LMS</span></h2>
                <span id="roleBadge" class="badge">STUDENT</span>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</button>
                <button class="nav-item" data-tab="courses" onclick="switchTab('courses')">Courses</button>
                <button class="nav-item" data-tab="assignments" onclick="switchTab('assignments')">Assignments</button>
                <button class="nav-item" data-tab="attendance" onclick="switchTab('attendance')">Attendance</button>
                <button class="nav-item" data-tab="payments" onclick="switchTab('payments')">Fee Payments</button>
                <button class="nav-item" data-tab="quizzes" onclick="switchTab('quizzes')">Quizzes</button>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">MA</div>
                    <div>
                        <p class="u-name">Muhammad Aliyan</p>
                        <small id="uRoleText">Student ID: #SMIT-4092</small>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Switch Role / Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar">
                <h1 id="pageTitle">Dashboard Overview</h1>
                <div class="topbar-actions">
                    <span id="currentDate"></span>
                </div>
            </header>

            <!-- Dynamic Tab Container -->
            <div id="tabContent" class="content-area"></div>
        </main>
    </div>

    
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Modal Title</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
